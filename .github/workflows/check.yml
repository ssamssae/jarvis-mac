name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/tests -q
      - run: xcrun swiftc -swift-version 5 scripts/native/jarvis_mac_listener.swift -o "$RUNNER_TEMP/JarvisMacOSS"
      - run: plutil -lint scripts/native/jarvis_mac_listener.Info.plist
